<svg xmlns="http://www.w3.org/2000/svg" width="805" height="720" viewBox="0 0 805 720" role="img" aria-labelledby="title description">
  <title id="title">Level curves and principal axes of a positive-definite quadratic form</title>
  <desc id="description">Four nested ellipses show levels 5, 10, 20, and 30 of q equals 3 x sub 1 squared minus 2 x sub 1 times x sub 2 plus 3 x sub 2 squared. The horizontal axis is x sub 1 and the vertical axis is x sub 2. The shorter principal axis slopes down to the right and has eigenvalue 4. The longer principal axis slopes up to the right and has eigenvalue 2.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#171717"/>
    </marker>
    <style>
      .grid { stroke: #dedede; stroke-width: 1.5; }
      .coordinate-axis { stroke: #8a8a8a; stroke-width: 2; }
      .frame { fill: none; stroke: #5f6368; stroke-width: 2.4; }
      .tick { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #4b5563; }
      .axis-label { font-family: "Times New Roman", Times, serif; font-size: 25px; font-style: italic; fill: #222222; }
      .principal-axis { stroke: #171717; stroke-width: 2.8; marker-end: url(#arrow); }
      .principal-label { font-family: "Times New Roman", Times, serif; font-size: 25px; font-weight: 700; font-style: italic; fill: #171717; }
      .level { fill: none; stroke-width: 4; vector-effect: non-scaling-stroke; }
      .legend-text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #222222; }
      .legend-title { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.5px; fill: #4b5563; }
    </style>
  </defs>

  <rect width="805" height="720" fill="#ffffff"/>

  <g aria-hidden="true">
    <line x1="154" y1="62" x2="154" y2="638" class="grid"/>
    <line x1="226" y1="62" x2="226" y2="638" class="grid"/>
    <line x1="298" y1="62" x2="298" y2="638" class="grid"/>
    <line x1="370" y1="62" x2="370" y2="638" class="coordinate-axis"/>
    <line x1="442" y1="62" x2="442" y2="638" class="grid"/>
    <line x1="514" y1="62" x2="514" y2="638" class="grid"/>
    <line x1="586" y1="62" x2="586" y2="638" class="grid"/>

    <line x1="82" y1="566" x2="658" y2="566" class="grid"/>
    <line x1="82" y1="494" x2="658" y2="494" class="grid"/>
    <line x1="82" y1="422" x2="658" y2="422" class="grid"/>
    <line x1="82" y1="350" x2="658" y2="350" class="coordinate-axis"/>
    <line x1="82" y1="278" x2="658" y2="278" class="grid"/>
    <line x1="82" y1="206" x2="658" y2="206" class="grid"/>
    <line x1="82" y1="134" x2="658" y2="134" class="grid"/>

    <rect x="82" y="62" width="576" height="576" class="frame"/>

    <text x="154" y="667" class="tick" text-anchor="middle">−3</text>
    <text x="370" y="667" class="tick" text-anchor="middle">0</text>
    <text x="586" y="667" class="tick" text-anchor="middle">3</text>
    <text x="69" y="572" class="tick" text-anchor="end">−3</text>
    <text x="69" y="356" class="tick" text-anchor="end">0</text>
    <text x="69" y="140" class="tick" text-anchor="end">3</text>
    <text x="630" y="338" class="axis-label">x<tspan baseline-shift="sub" font-size="18" font-style="normal">1</tspan></text>
    <text x="382" y="85" class="axis-label">x<tspan baseline-shift="sub" font-size="18" font-style="normal">2</tspan></text>
  </g>

  <!-- q = 4 y_1^2 + 2 y_2^2. At 72 px per unit, rx = 72 sqrt(c/4) and ry = 72 sqrt(c/2). -->
  <g transform="translate(370 350) rotate(45)">
    <ellipse cx="0" cy="0" rx="80.49845" ry="113.84200" class="level" stroke="#7a3e9d"/>
    <ellipse cx="0" cy="0" rx="113.84200" ry="160.99689" class="level" stroke="#2563eb"/>
    <ellipse cx="0" cy="0" rx="160.99689" ry="227.68399" class="level" stroke="#00897b"/>
    <ellipse cx="0" cy="0" rx="197.18012" ry="278.85480" class="level" stroke="#b7791f"/>
  </g>

  <g aria-label="Principal axes">
    <line x1="370" y1="350" x2="622" y2="602" class="principal-axis"/>
    <line x1="370" y1="350" x2="118" y2="98" class="principal-axis"/>
    <line x1="370" y1="350" x2="622" y2="98" class="principal-axis"/>
    <line x1="370" y1="350" x2="118" y2="602" class="principal-axis"/>

    <text x="620" y="624" class="principal-label">v′<tspan baseline-shift="sub" font-size="18">1</tspan></text>
    <text x="91" y="89" class="principal-label">−v′<tspan baseline-shift="sub" font-size="18">1</tspan></text>
    <text x="620" y="89" class="principal-label">v′<tspan baseline-shift="sub" font-size="18">2</tspan></text>
    <text x="91" y="624" class="principal-label">−v′<tspan baseline-shift="sub" font-size="18">2</tspan></text>
  </g>

  <g transform="translate(673 82)" aria-label="Level values">
    <rect x="0" y="0" width="119" height="144" rx="8" fill="#ffffff" fill-opacity="0.94" stroke="#c8c8c8"/>
    <text x="14" y="25" class="legend-title">LEVEL c</text>
    <line x1="15" y1="48" x2="48" y2="48" stroke="#7a3e9d" stroke-width="4"/>
    <text x="60" y="54" class="legend-text">5</text>
    <line x1="15" y1="76" x2="48" y2="76" stroke="#2563eb" stroke-width="4"/>
    <text x="60" y="82" class="legend-text">10</text>
    <line x1="15" y1="104" x2="48" y2="104" stroke="#00897b" stroke-width="4"/>
    <text x="60" y="110" class="legend-text">20</text>
    <line x1="15" y1="132" x2="48" y2="132" stroke="#b7791f" stroke-width="4"/>
    <text x="60" y="138" class="legend-text">30</text>
  </g>
</svg>
