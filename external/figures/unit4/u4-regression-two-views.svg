<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1180" viewBox="0 0 720 1180" role="img" aria-labelledby="regression-title regression-description">
  <title id="regression-title">Two views of the same line fit</title>
  <desc id="regression-description">The upper panel (a) shows the data points (0, 1), (1, 2), and (2, 2), the fitted line y-hat = 7/6 + t/2, and vertical residuals. The lower panel (b) shows the data vector y, its projection y-hat onto the column space of X, and the perpendicular residual r = y - y-hat.</desc>
  <defs>
    <marker id="arrow-blue-regression" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <path d="M 0 0 L 7 3 L 0 6 Z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-red-regression" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <path d="M 0 0 L 7 3 L 0 6 Z" fill="#c5050c"/>
    </marker>
    <marker id="arrow-gold-regression" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto">
      <path d="M 0 0 L 7 3 L 0 6 Z" fill="#9a6700"/>
    </marker>
    <style>
      .axis { stroke: #4f4f4f; stroke-width: 3; fill: none; }
      .tick { stroke: #4f4f4f; stroke-width: 2; }
      .fit { stroke: #c5050c; stroke-width: 5; fill: none; }
      .point { fill: #1f4e79; stroke: #ffffff; stroke-width: 2; }
      .residual-segment { stroke: #9a6700; stroke-width: 5; fill: none; stroke-dasharray: 0 10; stroke-linecap: round; }
      .residual-vector { stroke: #9a6700; stroke-width: 5; fill: none; marker-end: url(#arrow-gold-regression); }
      .plane { fill: #e9eef2; stroke: #4f4f4f; stroke-width: 4; }
      .data-vector { stroke: #1f4e79; stroke-width: 5; fill: none; marker-end: url(#arrow-blue-regression); }
      .fitted-vector { stroke: #c5050c; stroke-width: 5; fill: none; marker-end: url(#arrow-red-regression); }
      .math { font-family: "Times New Roman", Times, serif; font-size: 34px; fill: #111111; }
      .vector { font-style: italic; font-weight: 700; }
      .number { font-family: Arial, sans-serif; font-size: 28px; fill: #4f4f4f; }
      .panel-heading { font-family: Arial, sans-serif; font-size: 28px; font-weight: 600; fill: #111111; text-anchor: middle; }
    </style>
  </defs>
  <rect width="720" height="1180" fill="#ffffff"/>

  <g id="regression-data-panel">
    <text x="360" y="48" class="panel-heading">(a) Data plot</text>
    <line x1="80" y1="520" x2="680" y2="520" class="axis"/>
    <line x1="140" y1="545" x2="140" y2="100" class="axis"/>
    <line x1="140" y1="512" x2="140" y2="528" class="tick"/>
    <line x1="360" y1="512" x2="360" y2="528" class="tick"/>
    <line x1="580" y1="512" x2="580" y2="528" class="tick"/>
    <line x1="132" y1="360" x2="148" y2="360" class="tick"/>
    <line x1="132" y1="200" x2="148" y2="200" class="tick"/>
    <text x="140" y="565" class="number" text-anchor="middle">0</text>
    <text x="360" y="565" class="number" text-anchor="middle">1</text>
    <text x="580" y="565" class="number" text-anchor="middle">2</text>
    <text x="115" y="370" class="number" text-anchor="end">1</text>
    <text x="115" y="210" class="number" text-anchor="end">2</text>
    <text x="675" y="565" class="math" font-style="italic">t</text>
    <text x="112" y="105" class="math" font-style="italic">y</text>

    <!-- Coordinates: horizontal = 140 + 220 t; vertical = 520 - 160 y. -->
    <line x1="85" y1="353.333333" x2="635" y2="153.333333" class="fit"/>
    <text x="300" y="128" class="math" data-tex="\widehat y=\frac{7}{6}+\frac12t">
      <tspan font-style="italic">ŷ</tspan><tspan> = 7/6 + 1/2 </tspan><tspan font-style="italic">t</tspan>
    </text>

    <line x1="140" y1="333.333333" x2="140" y2="360" class="residual-segment"/>
    <line x1="360" y1="253.333333" x2="360" y2="200" class="residual-segment"/>
    <line x1="580" y1="173.333333" x2="580" y2="200" class="residual-segment"/>
    <text x="164" y="355" class="math" data-tex="r_1"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="23">1</tspan></text>
    <text x="384" y="220" class="math" data-tex="r_2"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="23">2</tspan></text>
    <text x="604" y="204" class="math" data-tex="r_3"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="23">3</tspan></text>
    <circle cx="140" cy="360" r="9" class="point"/>
    <circle cx="360" cy="200" r="9" class="point"/>
    <circle cx="580" cy="200" r="9" class="point"/>
  </g>

  <g id="regression-projection-panel">
    <text x="360" y="650" class="panel-heading">(b) Projection in output space</text>
    <polygon points="65,1140 550,1140 645,925 160,925" class="plane"/>
    <text x="535" y="1120" text-anchor="end" class="math" data-tex="\operatorname{col}(X)">
      <tspan>col(</tspan><tspan font-style="italic">X</tspan><tspan>)</tspan>
    </text>

    <circle cx="130" cy="1090" r="5" fill="#111111"/>
    <line x1="130" y1="1090" x2="455" y2="765" class="data-vector"/>
    <line x1="130" y1="1090" x2="455" y2="1005" class="fitted-vector"/>
    <line x1="455" y1="1005" x2="455" y2="765" class="residual-vector"/>
    <path d="M 455 977 L 483 977 L 483 1005" fill="none" stroke="#111111" stroke-width="3"/>

    <text x="280" y="900" class="math vector" data-tex="\mathbf{y}">y</text>
    <text x="270" y="1010" class="math" data-tex="\widehat{\mathbf{y}}=X\widehat{\mathbf{c}}">
      <tspan class="vector">ŷ</tspan><tspan> = </tspan><tspan font-style="italic">X</tspan><tspan class="vector">ĉ</tspan>
    </text>
    <text x="485" y="890" class="math" data-tex="\mathbf{r}=\mathbf{y}-\widehat{\mathbf{y}}">
      <tspan class="vector">r</tspan><tspan> = </tspan><tspan class="vector">y</tspan><tspan> − </tspan><tspan class="vector">ŷ</tspan>
    </text>
  </g>
</svg>
