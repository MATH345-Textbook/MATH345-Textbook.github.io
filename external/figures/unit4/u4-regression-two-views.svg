<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img">
  <defs>
    <marker id="arrow-blue-regression" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-red-regression" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#c5050c"/>
    </marker>
    <marker id="arrow-gold-regression" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#9a6700"/>
    </marker>
    <style>
      .axis { stroke: #4f4f4f; stroke-width: 3; fill: none; }
      .tick { stroke: #4f4f4f; stroke-width: 2; }
      .divider { stroke: #d7d7d7; stroke-width: 2; }
      .fit { stroke: #c5050c; stroke-width: 5; fill: none; }
      .point { fill: #1f4e79; stroke: #ffffff; stroke-width: 2; }
      .residual-segment { stroke: #9a6700; stroke-width: 5; fill: none; }
      .residual-vector { stroke: #9a6700; stroke-width: 5; fill: none; marker-end: url(#arrow-gold-regression); }
      .plane { fill: #e9eef2; stroke: #4f4f4f; stroke-width: 4; }
      .data-vector { stroke: #1f4e79; stroke-width: 5; fill: none; marker-end: url(#arrow-blue-regression); }
      .fitted-vector { stroke: #c5050c; stroke-width: 5; fill: none; marker-end: url(#arrow-red-regression); }
      .math { font-family: "Times New Roman", Times, serif; font-size: 28px; fill: #111111; }
      .math-small { font-family: "Times New Roman", Times, serif; font-size: 23px; fill: #111111; }
      .vector { font-style: italic; font-weight: 700; }
      .number { font-family: Arial, sans-serif; font-size: 18px; fill: #4f4f4f; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <line x1="600" y1="35" x2="600" y2="485" class="divider"/>

  <line x1="85" y1="430" x2="555" y2="430" class="axis"/>
  <line x1="120" y1="465" x2="120" y2="55" class="axis"/>
  <line x1="150" y1="422" x2="150" y2="438" class="tick"/>
  <line x1="315" y1="422" x2="315" y2="438" class="tick"/>
  <line x1="480" y1="422" x2="480" y2="438" class="tick"/>
  <line x1="112" y1="290" x2="128" y2="290" class="tick"/>
  <line x1="112" y1="150" x2="128" y2="150" class="tick"/>
  <text x="145" y="463" class="number">0</text>
  <text x="310" y="463" class="number">1</text>
  <text x="475" y="463" class="number">2</text>
  <text x="91" y="296" class="number">1</text>
  <text x="91" y="156" class="number">2</text>
  <text x="548" y="462" class="math" font-style="italic">t</text>
  <text x="91" y="70" class="math" font-style="italic">y</text>

  <line x1="100" y1="288" x2="530" y2="107" class="fit"/>
  <text x="280" y="90" class="math-small" data-tex="\widehat y=\frac{7}{6}+\frac12t">
    <tspan font-style="italic">ŷ</tspan><tspan> = 7/6 + 1/2 </tspan><tspan font-style="italic">t</tspan>
  </text>

  <line x1="150" y1="267" x2="150" y2="290" class="residual-segment"/>
  <line x1="315" y1="197" x2="315" y2="150" class="residual-segment"/>
  <line x1="480" y1="127" x2="480" y2="150" class="residual-segment"/>
  <text x="163" y="284" class="math-small" data-tex="r_1"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="16">1</tspan></text>
  <text x="328" y="177" class="math-small" data-tex="r_2"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="16">2</tspan></text>
  <text x="493" y="146" class="math-small" data-tex="r_3"><tspan font-style="italic">r</tspan><tspan baseline-shift="sub" font-size="16">3</tspan></text>

  <circle cx="150" cy="290" r="9" class="point"/>
  <circle cx="315" cy="150" r="9" class="point"/>
  <circle cx="480" cy="150" r="9" class="point"/>

  <polygon points="675,390 1040,390 1110,220 745,220" class="plane"/>
  <text x="855" y="365" class="math" data-tex="\operatorname{col}(X)">
    <tspan>col(</tspan><tspan font-style="italic">X</tspan><tspan>)</tspan>
  </text>

  <circle cx="730" cy="360" r="5" fill="#111111"/>
  <line x1="730" y1="360" x2="970" y2="105" class="data-vector"/>
  <line x1="730" y1="360" x2="970" y2="300" class="fitted-vector"/>
  <line x1="970" y1="300" x2="970" y2="105" class="residual-vector"/>

  <path d="M 970 278 L 992 278 L 992 300" fill="none" stroke="#111111" stroke-width="3"/>

  <text x="845" y="190" class="math vector" data-tex="\mathbf{y}">y</text>
  <text x="785" y="320" class="math-small" data-tex="\widehat{\mathbf{y}}=X\widehat{\mathbf{c}}">
    <tspan class="vector">ŷ</tspan><tspan> = </tspan><tspan font-style="italic">X</tspan><tspan class="vector">ĉ</tspan>
  </text>
  <text x="995" y="205" class="math-small" data-tex="\mathbf{r}=\mathbf{y}-\widehat{\mathbf{y}}">
    <tspan class="vector">r</tspan><tspan> = </tspan><tspan class="vector">y</tspan><tspan> − </tspan><tspan class="vector">ŷ</tspan>
  </text>
</svg>
