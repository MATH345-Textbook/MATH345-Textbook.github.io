<article class="definition definition-like"><h4 class="heading">
<span class="type">Definition</span><span class="space"> </span><span class="codenumber">5.3.5</span><span class="period">.</span><span class="space"> </span><span class="title">Orthogonal diagonalizability.</span>
</h4>
<div class="para">A matrix <span class="process-math">\(A\)</span> is <dfn class="terminology">orthogonally diagonalizable</dfn> when an <em class="emphasis">orthogonal matrix</em> <span class="process-math">\(Q\)</span> can be found such that <span class="process-math">\(Q^{-1}A Q\)</span> is a diagonal matrix. Since <span class="process-math">\(Q^{-1} = Q^T\text{,}\)</span> this is equivalent to <span class="process-math">\(Q^T A Q\)</span> being a diagonal matrix.<div class="autopermalink" data-description="Paragraph"><a href="#def-orthogonal-diagonalizability-2-1" title="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
